name: halyk_dct
description: "Halyk DCT — терминал сбора данных для приёмки товаров"
publish_to: 'none'

version: 1.0.0+4

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Navigation
  go_router: ^14.6.2

  # Barcode scanning
  mobile_scanner: ^6.0.4

  # Image picker (для фото брака)
  image_picker: ^1.1.2

  # HTTP клиент (для реального API)
  dio: ^5.7.0

  # Локальное хранение токена
  flutter_secure_storage: ^9.2.2

  # UUID
  uuid: ^4.5.1

  # Форматирование дат
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  riverpod_generator: ^2.6.3
  custom_lint: ^0.7.5
  riverpod_lint: ^2.6.3

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/images/
